name: PE Daily Research

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run research
        id: research
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          chmod +x scripts/run_research.sh
          bash scripts/run_research.sh

      - name: Commit report
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "research-bot"
          git config user.email "bot@localhost"
          if [ -f "daily_reports/${DATE}.md" ]; then
            git add daily_reports/
            git commit -m "daily research: ${DATE}" || true
            git push
          fi

      - name: Notify WeCom
        env:
          WECOM_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          bash scripts/send_wecom.sh "${DATE}" "${WECOM_KEY}"
