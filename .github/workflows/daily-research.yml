name: PE Daily Research

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run research
        id: research
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL && secrets.LLM_MODEL || 'deepseek-chat' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL && secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
        run: |
          bash scripts/run_research.sh

      - name: Commit report
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "research-bot"
          git config user.email "bot@localhost"
          if [ -f "daily_reports/${DATE}.md" ]; then
            git add daily_reports/
            git commit -m "daily research: ${DATE}" || true
            git push
          fi

      - name: Notify WeCom
        env:
          WECOM_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          bash scripts/send_wecom.sh "${DATE}" "${WECOM_KEY}"
