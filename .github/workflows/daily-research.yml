name: PE Daily Research

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch arXiv (parallel)
        run: |
          # 三路并行搜索，覆盖更宽
          curl -s "http://export.arxiv.org/api/query?search_query=ti:power+OR+ti:converter+OR+ti:inverter+AND+(ti:LLM+OR+ti:agent+OR+ti:AI+OR+ti:language+model)&sortBy=submittedDate&sortOrder=descending&max_results=8" -o /tmp/arxiv_title.xml &
          curl -s "http://export.arxiv.org/api/query?search_query=all:%22power+electronics%22+AND+all:agent&sortBy=submittedDate&sortOrder=descending&max_results=6" -o /tmp/arxiv_pe.xml &
          curl -s "http://export.arxiv.org/api/query?search_query=all:%22motor+control%22+AND+all:(deep+learning+OR+reinforcement)&sortBy=submittedDate&sortOrder=descending&max_results=4" -o /tmp/arxiv_motor.xml &
          curl -s "http://export.arxiv.org/api/query?search_query=all:embedded+AND+all:(AI+agent+OR+LLM+firmware)&sortBy=submittedDate&sortOrder=descending&max_results=4" -o /tmp/arxiv_embedded.xml &
          wait
          echo "ArXiv fetching done"

      - name: Fetch GitHub
        run: |
          curl -s "https://api.github.com/search/repositories?q=power+electronics+AI+agent+OR+inverter+LLM&sort=updated&per_page=6" -o /tmp/gh.json
          echo "GitHub fetched"

      - name: Generate report
        id: report
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python3 scripts/gen_report.py

      - name: Commit and push
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "research-bot"
          git config user.email "bot@localhost"
          if [ -f "daily_reports/${DATE}.md" ]; then
            git add daily_reports/
            git commit -m "daily research: ${DATE}" || true
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
            git push
          fi

      - name: Notify WeCom
        env:
          WECOM_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          if [ -z "${WECOM_KEY}" ]; then
            echo "Skip WeCom (no key)"
            exit 0
          fi
          REPORT_FILE="daily_reports/${DATE}.md"
          if [ ! -f "$REPORT_FILE" ]; then
            curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"msgtype":"text","text":{"content":"PE Research: '${DATE}' failed - no report generated"}}' >/dev/null
            exit 0
          fi
          # 推送企业微信：短文本通知 + 报告链接
          WECOM_URL="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}"
          PAPER_COUNT=$(grep -c '^###' "$REPORT_FILE" 2>/dev/null || echo 0)
          curl -s -X POST "$WECOM_URL" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"📡 PE Research ${DATE}\\n\\nPapers: ${PAPER_COUNT}  |  Full Report:\\nhttps://github.com/${GITHUB_REPOSITORY}/blob/main/${REPORT_FILE}\"}}" \
            >/dev/null 2>&1 && echo "WeCom OK" || echo "WeCom fail"
