name: PE Daily Research

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run research
        id: research
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          REPORT_DIR="daily_reports"
          mkdir -p "$REPORT_DIR"

          echo "=== Research $DATE ==="

          # ---- arXiv ----
          echo "Fetching arXiv..."
          curl -s "http://export.arxiv.org/api/query?search_query=all:power+electronics+AND+all:(agent+LLM)&sortBy=submittedDate&sortOrder=descending&max_results=5" -o /tmp/arxiv.xml

          # ---- GitHub ----
          echo "Fetching GitHub..."
          curl -s "https://api.github.com/search/repositories?q=power+electronics+AI+agent&sort=updated&per_page=5" -o /tmp/gh.json

          # ---- npm ----
          echo "Checking npm..."
          OH_MY_EMBEDDED_VER=$(curl -s "https://registry.npmjs.org/oh-my-embedded/latest" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")

          # ---- Generate report ----
          python3 -u -c "
import json, os, sys
from xml.etree import ElementTree

today = '$DATE'
api_key = os.environ.get('LLM_API_KEY', '')
npm_ver = '$OH_MY_EMBEDDED_VER'

# Parse arXiv
papers = []
try:
    root = ElementTree.fromstring(open('/tmp/arxiv.xml').read())
    ns = {'a': 'http://www.w3.org/2005/Atom'}
    for entry in root.findall('a:entry', ns)[:5]:
        t = entry.find('a:title', ns)
        title = t.text.strip().replace('\n',' ') if t is not None else '?'
        u = entry.find('a:id', ns)
        url = u.text.strip() if u is not None else ''
        papers.append({'title': title, 'url': url})
except: pass

# Parse GitHub
repos = []
try:
    gh = json.load(open('/tmp/gh.json'))
    for item in gh.get('items', [])[:5]:
        repos.append({
            'name': item.get('full_name', ''),
            'url': item.get('html_url', ''),
            'desc': item.get('description', '') or '',
            'stars': item.get('stargazers_count', 0),
        })
except: pass

# Build report
lines = [
    f'# Power Electronics x AI Agent Daily Research',
    f'',
    f'Date: {today}',
    f'',
    f'---',
    f'',
    f'## New Papers',
    f'',
]
for p in papers:
    lines.append(f'- [{p[\"title\"]}]({p[\"url\"]})')
if not papers:
    lines.append('(No new papers found today)')

lines += ['', '---', '', '## GitHub Projects', '']
for r in repos:
    lines.append(f'- [{r[\"name\"]}]({r[\"url\"]}) | {r[\"desc\"][:100]} | {r[\"stars\"]} stars')
if not repos:
    lines.append('(No new projects found)')

lines += ['', '---', '', f'## Tool Versions', f'- oh-my-embedded: v{npm_ver}', '']

# Try LLM summary
if api_key:
    try:
        import urllib.request
        prompt = 'Summarize the following power electronics research findings in Chinese:\n\n'
        for p in papers:
            prompt += f'- Paper: {p[\"title\"]}\n'
        for r in repos:
            prompt += f'- GitHub: {r[\"name\"]}: {r[\"desc\"][:100]}\n'

        payload = json.dumps({
            'model': 'deepseek-chat',
            'messages': [
                {'role': 'system', 'content': '你是电力电子领域的AI研究助理，用中文输出。'},
                {'role': 'user', 'content': prompt}
            ],
            'max_tokens': 1024,
            'temperature': 0.3
        }).encode()
        req = urllib.request.Request(
            'https://api.deepseek.com/chat/completions',
            data=payload,
            headers={'Content-Type': 'application/json', 'Authorization': f'Bearer {api_key}'},
            method='POST'
        )
        resp = urllib.request.urlopen(req, timeout=60)
        result = json.loads(resp.read())
        summary = result['choices'][0]['message']['content']
        lines += ['', '## AI Summary', '', summary, '']
    except Exception as e:
        lines += ['', f'<!-- LLM error: {e} -->', '']

lines += ['', '---', '', '*Auto-generated by GitHub Actions*', '']
report = '\n'.join(lines)
with open(f'{os.environ[\"REPORT_DIR\"]}/{today}.md', 'w', encoding='utf-8') as f:
    f.write(report)
print(f'Report saved: {today}.md')
" 2>&1

      - name: Commit and push
        run: |
          DATE=$(date +%Y-%m-%d)
          git config user.name "research-bot"
          git config user.email "bot@localhost"
          if [ -f "daily_reports/${DATE}.md" ]; then
            git add daily_reports/
            git commit -m "daily research: ${DATE}" || true
            git push
            echo "Pushed report for ${DATE}"
          fi

      - name: Notify WeCom
        env:
          WECOM_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          if [ -z "${WECOM_KEY}" ]; then
            echo "No WeCom key, skip"
            exit 0
          fi
          REPORT_FILE="daily_reports/${DATE}.md"
          if [ -f "$REPORT_FILE" ]; then
            MSG=$(head -c 1500 "$REPORT_FILE")
            curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'msgtype':'markdown','markdown':{'content':sys.stdin.read()}}))" <<< "# PE Daily Research: ${DATE}

${MSG}

[View Full Report](https://github.com/${{ github.repository }}/blob/main/${REPORT_FILE})")" 2>/dev/null && echo "WeCom notified" || echo "WeCom notify failed"
          fi
